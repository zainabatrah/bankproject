name: BankShield CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: NestJS backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/bankshield_test
      JWT_SECRET: test-jwt-secret-at-least-32-characters-long
      MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      FRAUD_ENGINE_URL: http://127.0.0.1:8000
      FRAUD_API_KEY: test-fraud-api-key
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint backend
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Test backend
        run: npm test -- --runInBand

      - name: Build backend
        run: npm run build

  fraud-service:
    name: FastAPI fraud service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/fraud-service

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: fraud_detection_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      FRAUD_API_KEY: test-fraud-api-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/fraud-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test fraud service
        run: pytest -q

  frontend:
    name: Banking frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  security-dashboard:
    name: Security dashboard
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: security-dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: security-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint dashboard
        run: npm run lint

      - name: Test dashboard
        run: npm test

      - name: Build dashboard
        run: npm run build